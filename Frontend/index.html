<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM Panda | Certified Instagram DM Automation Tool</title>
    <meta name="description" content="Automate Instagram DMs, comments, shares, and stories with DM Panda. Certified Meta Business Partner. Safe, simple, and affordable automation for creators." />
    <meta name="keywords" content="instagram automation, instagram dm automation, comment auto reply, auto send message instagram, link in bio page, dm panda" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="DM Panda" />
    <meta name="theme-color" content="#833AB4" />
    <link rel="canonical" href="https://dmpanda.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dmpanda.com/" />
    <meta property="og:title" content="DM Panda | Certified Instagram DM Automation Tool" />
    <meta property="og:description" content="Automate Instagram DMs, comments, shares, and stories with DM Panda. Certified Meta Business Partner. Safe, simple, and affordable automation." />
    <meta property="og:image" content="https://dmpanda.com/images/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="DM Panda" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://dmpanda.com/" />
    <meta property="twitter:title" content="DM Panda | Certified Instagram DM Automation Tool" />
    <meta property="twitter:description" content="Automate Instagram DMs, comments, shares, and stories with DM Panda. Certified Meta Business Partner." />
    <meta property="twitter:image" content="https://dmpanda.com/images/logo.png" />

    <!-- Schema.org JSON-LD Structured Data for Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "@id": "https://dmpanda.com/#software",
          "name": "DM Panda",
          "operatingSystem": "Cloud, Web, Instagram Graph API",
          "applicationCategory": "BusinessApplication, MarketingApplication",
          "url": "https://dmpanda.com",
          "description": "Official Meta Certified Instagram DM and Comment Automation Tool for creators, businesses, and influencers.",
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "USD",
            "lowPrice": "0",
            "offerCount": "4"
          },
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.9",
            "reviewCount": "1250",
            "bestRating": "5"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://dmpanda.com/#organization",
          "name": "DM Panda",
          "url": "https://dmpanda.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://dmpanda.com/images/logo.png"
          },
          "sameAs": [
            "https://instagram.com/dmpanda",
            "https://twitter.com/dmpanda"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://dmpanda.com/#website",
          "url": "https://dmpanda.com",
          "name": "DM Panda",
          "publisher": {
            "@id": "https://dmpanda.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://dmpanda.com/blog?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Resource hints: connect early to font + API origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google Fonts stylesheet -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
    />
